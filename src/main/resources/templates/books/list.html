
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="#{book.catalogue}">Book Catalogue</title>

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>


<div class="language-switcher">
  <a th:href="@{/books(lang='ru')}"
     th:classappend="${#locale.language == 'ru'} ? ' active' : ''">
    RU
  </a>

  <span>|</span>

  <a th:href="@{/books(lang='en')}"
     th:classappend="${#locale.language == 'en'} ? ' active' : ''">
    EN
  </a>
</div>

<h1 th:text="#{book.catalogue}">Book Catalogue</h1>

<div class="alert"
     th:if="${message != null}"
     th:text="${message}">
</div>

<p>
  <a th:href="@{/books/new}"
     th:text="#{book.new}">
    New book
  </a>
</p>

<form th:action="@{/books}" method="get">

  <label for="author"
         th:text="#{book.author}">
    Author
  </label>

  <input id="author"
         name="author"
         type="text"
         th:value="${author}">

  <button type="submit"
          th:text="#{book.search}">
    Search
  </button>

</form>

<p th:if="${#lists.isEmpty(books)}"
   th:text="#{book.empty}">
  No books found
</p>

<table th:unless="${#lists.isEmpty(books)}">

  <thead>
  <tr>
    <th>ID</th>
    <th th:text="#{book.title}">Title</th>
    <th th:text="#{book.author}">Author</th>
    <th th:text="#{book.year}">Year</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="book : ${books}">
    <td th:text="${book.id()}">1</td>

    <td>
      <a th:href="@{/books/{id}(id=${book.id()})}"
         th:text="${book.title()}">
        Book title
      </a>
    </td>

    <td th:text="${book.author()}">Author</td>

    <td th:text="${book.year()}">2025</td>
  </tr>
  </tbody>

</table>

</body>
</html>
