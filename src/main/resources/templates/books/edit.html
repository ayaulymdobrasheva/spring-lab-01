<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<p>
    <span sec:authentication="name">user</span>
<form th:action="@{/logout}" method="post" style="display:inline">
    <button type="submit">Log out</button>
</form>
</p>

<h1>Edit book</h1>

<form th:action="@{/books/{id}/edit(id=${book.id})}" method="post">
    <p>
        <label>Title:
            <input type="text" name="title" th:value="${book.title}" required>
        </label>
    </p>
    <p>
        <label>Genre:
            <input type="text" name="genre" th:value="${book.genre}" required>
        </label>
    </p>
    <p>
        <label>Year:
            <input type="number" name="year" th:value="${book.year}" required>
        </label>
    </p>
    <button type="submit">Save</button>
    <a th:href="@{/books/{id}(id=${book.id})}">Cancel</a>
</form>
</body>
</html>
