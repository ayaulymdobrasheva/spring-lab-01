<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.book.notfound}">Book not found</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1 th:text="#{error.book.notfound}">Book not found</h1>

<div class="alert">
    <p th:text="#{error.book.description}">
        The requested book does not exist.
    </p>
    <p th:text="${message}"></p>
</div>

<a th:href="@{/books}" th:text="#{book.back}">
    Back to catalogue
</a>

</body>
</html>
